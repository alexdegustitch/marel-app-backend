spring.application.name=marel-app

server.port=8080

# ===============================
# DATABASE
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5432/marel_app
spring.datasource.username=aleksandarparipovic
spring.datasource.password=${DB_PASSWORD}

# ===============================
# JPA / HIBERNATE (DEV ONLY)
# ===============================
# validate, NOT update. This project has no Flyway or Liquibase: the .sql files
# in resources/sql are run by hand, and nothing records which ones went in.
#
# With `update`, Hibernate improvised the parts of the schema it could — new
# tables and NULLABLE columns — and silently skipped every NOT NULL column it
# could not add to a non-empty table. The application then started fine and threw
# "column ... does not exist" at runtime, weeks later, for a migration nobody had
# noticed was missing. Worse, a table it had already created made the migration's
# own CREATE TABLE IF NOT EXISTS skip the whole definition, defaults and
# constraints included, so running the migration afterwards did not repair it.
#
# `validate` turns all of that into one clear failure at startup: the schema does
# not match, run the migrations.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=validate

# ===============================
# BOOTSTRAP ADMIN (DEV ONLY)
# ===============================
app.bootstrap.admin.password=${BOOTSTRAP_ADMIN_PASSWORD}

# ===============================
# SECURITY TOKENS
# ===============================
app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.access-token-ttl-seconds=900
app.security.refresh-token.ttl-seconds=2592000
app.security.refresh-token.cookie-name=refresh_token
app.security.refresh-token.cookie-secure=false
app.security.refresh-token.cookie-same-site=Lax
app.security.cors.allowed-origins=http://localhost:5123,http://localhost:5173,http://localhost:3000

# ===============================
# GOOGLE OAUTH ("Continue with Google")
# Set real values via env vars GOOGLE_OAUTH_CLIENT_ID / GOOGLE_OAUTH_CLIENT_SECRET —
# never commit real credentials here. Redirect URI must exactly match what's
# registered in Google Cloud Console for the OAuth client.
# ===============================
google.oauth.client-id=${GOOGLE_OAUTH_CLIENT_ID}
google.oauth.client-secret=${GOOGLE_OAUTH_CLIENT_SECRET}
google.oauth.redirect-uri=http://localhost:8080/api/auth/google/callback
app.deep-link.scheme=marel
# Where the web (browser) build of the app is served — the Google callback redirects
# here for browser-based logins instead of using the marel:// deep link.
app.web-app-url=http://localhost:5123

# ===============================
# RECALC WORKER (DB QUEUE ONLY)
# ===============================
app.recalc.daily-threads=2
app.recalc.monthly-threads=1
app.recalc.daily-batch=5
app.recalc.monthly-batch=3
app.recalc.max-retry=5
app.recalc.base-backoff-ms=1000
app.recalc.stuck-timeout-seconds=300
app.recalc.stuck-recovery-batch=20
app.recalc.min-idle-sleep-ms=100
app.recalc.max-idle-sleep-ms=2000
app.recalc.loop-time-budget-ms=5000
app.recalc.websocket-debounce-ms=300
app.recalc.metrics-log-interval-ms=60000
app.recalc.pending-warn-threshold-daily=500
app.recalc.pending-warn-threshold-monthly=200
app.recalc.pending-latency-warn-seconds-daily=300
app.recalc.pending-latency-warn-seconds-monthly=300
app.recalc.warn-cooldown-ms=60000
app.recalc.cleanup-enabled=true
app.recalc.cleanup-interval-ms=60000
app.recalc.cleanup-initial-delay-ms=30000
app.recalc.cleanup-batch-size=200
app.recalc.done-retention-days=7

# ===============================
# ACTUATOR / METRICS
# ===============================
management.endpoints.web.exposure.include=health,info,metrics

# ===============================
# TRANSACTIONAL OUTBOX
# Business events are written in the same transaction as the change that caused
# them, then drained here. Same polling + FOR UPDATE SKIP LOCKED pattern as the
# recalc workers — no message broker.
# ===============================
app.outbox.poll-interval-ms=2000
app.outbox.batch-size=20
app.outbox.max-retry=5
app.outbox.base-backoff-ms=1000

# ===============================
# NOTIFICATION DELIVERY
# Second stage: sends what the fan-out queued. No email provider is configured,
# so EmailSender falls back to a logging adapter and nothing actually leaves the
# system until a real adapter bean is added.
# ===============================
app.notifications.delivery.poll-interval-ms=5000
app.notifications.delivery.batch-size=20
app.notifications.delivery.max-retry=5
app.notifications.delivery.base-backoff-ms=5000

# ===============================
# SESSIONS AND ONLINE PRESENCE
# Presence is derived from user_sessions.last_seen_at, never a stored boolean.
# The client heartbeat interval and the server's online threshold must be tuned
# together: the threshold has to comfortably exceed the interval, or a live user
# flickers offline between beats.
# ===============================
app.session.heartbeat-seconds=45
app.session.online-threshold-seconds=120
app.outbox.stuck-timeout-seconds=300
