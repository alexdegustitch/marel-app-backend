spring.application.name=marel-app

server.port=8080
# Behind a reverse proxy the application only learns the request arrived over
# HTTPS from the X-Forwarded-* headers nginx sets. Without this, a cookie marked
# Secure is written on what Spring believes is a plain HTTP request, and the
# Google callback redirects come back as http://. Harmless in development, where
# there is no proxy and no such headers arrive.
server.forward-headers-strategy=native

# ===============================
# LOCAL SECRETS
# ===============================
# Reads .env from the working directory, if present, so the ${...} placeholders
# below resolve no matter how the app is launched - IDE run configuration, plain
# `./mvnw spring-boot:run`, or scripts/run-dev.sh. Without this only a shell that
# had already exported the variables would work, which is a trap: the app starts
# from one terminal and fails from the IDE with the same code and no clue why.
#
# `optional:` means a missing .env is not an error - that is the deployed case,
# where the variables come from the real environment. The `[.properties]` suffix
# tells Spring how to parse a file whose name carries no recognised extension.
#
# Precedence works in the right direction: OS environment variables outrank an
# imported config file, so a real deployment's variables always win over a .env
# that happened to be lying next to the jar.
spring.config.import=optional:file:.env[.properties]

# ===============================
# DATABASE
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5432/marel_app
spring.datasource.username=aleksandarparipovic
spring.datasource.password=${DB_PASSWORD}

# ===============================
# MIGRATIONS (FLYWAY)
# ===============================
# Runs automatically at startup, before Hibernate validates. New migrations go
# in db/migration as V<version>__<description>.sql; Flyway applies whatever the
# target database has not yet seen, in version order, and records what ran in
# flyway_schema_history.
#
# The 110 scripts that built the schema by hand before Flyway was adopted are
# archived under resources/sql/archive — their combined effect is V1, not
# reapplied. They are not deleted because most of them explain a real decision,
# not just the SQL; see that directory's README.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ===============================
# JPA / HIBERNATE (DEV ONLY)
# ===============================
# validate, NOT update — a second, independent check, and it costs nothing.
#
# With `update`, Hibernate improvised the parts of the schema it could — new
# tables and NULLABLE columns — and silently skipped every NOT NULL column it
# could not add to a non-empty table. The application then started fine and threw
# "column ... does not exist" at runtime, weeks later, for a migration nobody had
# noticed was missing. Worse, a table it had already created made the migration's
# own CREATE TABLE IF NOT EXISTS skip the whole definition, defaults and
# constraints included, so running the migration afterwards did not repair it.
#
# `validate` turns all of that into one clear failure at startup: the schema does
# not match, run the migrations.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=validate

# ===============================
# BOOTSTRAP ADMIN (DEV ONLY)
# ===============================
app.bootstrap.admin.password=${BOOTSTRAP_ADMIN_PASSWORD}

# ===============================
# BOOTSTRAP DEVELOPER
# The internal engineering account — the only role allowed to read /actuator.
# Created ONLY when a password is supplied: a default would ship identical
# credentials for an all-permissions account on every installation. Leave the
# variable unset where the account is not wanted; startup then skips it and says
# so in the log.
# ===============================
app.bootstrap.developer.password=${BOOTSTRAP_DEVELOPER_PASSWORD:}

# ===============================
# SECURITY TOKENS
# ===============================
app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.access-token-ttl-seconds=900
app.security.refresh-token.ttl-seconds=2592000
app.security.refresh-token.cookie-name=refresh_token
# The refresh cookie. Defaults are the DEVELOPMENT ones; production overrides
# them with the env vars named here.
#
#   REFRESH_COOKIE_SECURE=true       — required once the site is on HTTPS.
#   REFRESH_COOKIE_SAME_SITE=Lax     — correct for dooklytics.com talking to
#                                      api.dooklytics.com: different ORIGIN, but
#                                      the same SITE, so Lax cookies are still
#                                      sent. "None" would only be needed if the
#                                      API moved to an unrelated domain, and it
#                                      weakens the CSRF protection Lax gives.
#
# The cookie is deliberately host-only (no Domain attribute): it is set by, and
# sent to, whichever host serves /api/auth. Adding a Domain would widen it to
# every subdomain, which is more exposure than this needs.
app.security.refresh-token.cookie-secure=${REFRESH_COOKIE_SECURE:false}
app.security.refresh-token.cookie-same-site=${REFRESH_COOKIE_SAME_SITE:Lax}

# Which ORIGINS the browser may call this API from. Not a formality: the CORS
# config sets allowCredentials(true), so a wildcard is rejected outright and each
# origin has to be named. Production: CORS_ALLOWED_ORIGINS=https://dooklytics.com
app.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5123,http://localhost:5173,http://localhost:3000}

# ===============================
# GOOGLE OAUTH ("Continue with Google")
# Set real values via env vars GOOGLE_OAUTH_CLIENT_ID / GOOGLE_OAUTH_CLIENT_SECRET —
# never commit real credentials here. Redirect URI must exactly match what's
# registered in Google Cloud Console for the OAuth client.
# ===============================
google.oauth.client-id=${GOOGLE_OAUTH_CLIENT_ID}
google.oauth.client-secret=${GOOGLE_OAUTH_CLIENT_SECRET}
# Must match EXACTLY what is registered for the OAuth client in Google Cloud
# Console. Production: GOOGLE_OAUTH_REDIRECT_URI=https://api.dooklytics.com/api/auth/google/callback
google.oauth.redirect-uri=${GOOGLE_OAUTH_REDIRECT_URI:http://localhost:8080/api/auth/google/callback}
app.deep-link.scheme=marel
# Where the web (browser) build of the app is served.
#
# TWO jobs, both of which fail silently if this is wrong:
#   1. the Google callback redirects here for browser logins, and
#   2. every deep link inside a notification e-mail is built from it
#      (NotificationEmailComposer: webAppUrl + "/#" + route).
#
# A wrong value here is written into mails that have already gone out, so it is
# not something a later correction repairs.
# Production: WEB_APP_URL=https://dooklytics.com
app.web-app-url=${WEB_APP_URL:http://localhost:5123}

# ===============================
# RECALC WORKER (DB QUEUE ONLY)
# ===============================
app.recalc.daily-threads=2
app.recalc.monthly-threads=1
app.recalc.daily-batch=5
app.recalc.monthly-batch=3
app.recalc.max-retry=5
app.recalc.base-backoff-ms=1000
app.recalc.stuck-timeout-seconds=300
app.recalc.stuck-recovery-batch=20
app.recalc.min-idle-sleep-ms=100
app.recalc.max-idle-sleep-ms=2000
app.recalc.loop-time-budget-ms=5000
app.recalc.websocket-debounce-ms=300
app.recalc.metrics-log-interval-ms=60000
app.recalc.pending-warn-threshold-daily=500
app.recalc.pending-warn-threshold-monthly=200
app.recalc.pending-latency-warn-seconds-daily=300
app.recalc.pending-latency-warn-seconds-monthly=300
app.recalc.warn-cooldown-ms=60000
app.recalc.cleanup-enabled=true
app.recalc.cleanup-interval-ms=60000
app.recalc.cleanup-initial-delay-ms=30000
app.recalc.cleanup-batch-size=200
app.recalc.done-retention-days=7

# ===============================
# ACTUATOR / METRICS
# Only /actuator/health is reachable without signing in (see SecurityConfig);
# the index, info and metrics require the "developer" role. show-details is pinned
# to never so the open endpoint answers UP/DOWN and nothing about the database
# behind it. Whatever is listed here is what exists — adding an endpoint to this
# line is what makes it reachable at all.
# ===============================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never

# ===============================
# SIGN-IN RATE LIMIT
# Guards the credential endpoints, which must stay public and are the only part
# of the application an unauthenticated stranger can call. Failed attempts are
# counted per caller address; a correct sign-in clears the count, so ordinary use
# is never slowed down.
#
# trust-forwarded-header MUST be true behind a reverse proxy (otherwise every
# request looks like 127.0.0.1 and one guesser blocks everybody) and MUST stay
# false on a directly exposed server (otherwise the caller picks its own key and
# the limit means nothing).
# ===============================
app.security.login-rate-limit.max-failures=15
app.security.login-rate-limit.window-seconds=300
app.security.login-rate-limit.block-seconds=600
app.security.login-rate-limit.trust-forwarded-header=false

# ===============================
# TRANSACTIONAL OUTBOX
# Business events are written in the same transaction as the change that caused
# them, then drained here. Same polling + FOR UPDATE SKIP LOCKED pattern as the
# recalc workers — no message broker.
# ===============================
app.outbox.poll-interval-ms=2000
app.outbox.batch-size=20
app.outbox.max-retry=5
app.outbox.base-backoff-ms=1000

# ===============================
# DASHBOARD ANALYTICS SNAPSHOT
# The supervisor's board reads a snapshot computed once a morning (05:15
# Europe/Belgrade), never aggregates on page load. This flag only governs the
# extra catch-up run at startup, for a server that comes up with no snapshot for
# today; the scheduled run is always on.
# ===============================
app.dashboard.insights.compute-on-startup=true

# ===============================
# MAIL / POSTMARK
# PostmarkEmailSender registers itself only when spring.mail.username is set, so a
# machine without credentials keeps the logging adapter and sends nothing — no
# flag to remember, no quota spent by a developer running the app.
#
# app.mail.from must be a verified Sender Signature, or any address on a domain
# verified in Postmark. It is the envelope sender for every message; the acting
# employee's name goes in the display name and their address in Reply-To, which
# needs no verification.
#
# Postmark, not Brevo, and the reason is the order conversation. Threading needs
# our own Message-ID to survive the relay: Postmark keeps it when the message
# carries X-PM-KeepID, Brevo keeps it too but injects a tracking pixel and a
# one-click List-Unsubscribe into every transactional mail — a button that lets a
# worker silently remove himself from production notifications, and which Brevo
# does not remove from SMTP traffic. Resend and SES replace the Message-ID
# outright, which breaks threading with no workaround. All three were tested
# against live sends before this line was changed.
#
# MAIL_USERNAME and MAIL_PASSWORD are BOTH the Postmark Server API Token — not
# the Account token, and not an address.
# ===============================
spring.mail.host=${MAIL_HOST:smtp.postmarkapp.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# The delivery worker already retries with backoff, so failing fast beats holding
# a worker thread on an unresponsive relay.
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

app.mail.from=${MAIL_FROM:no-reply@dooklytics.com}
app.mail.from-name=${MAIL_FROM_NAME:Dooklytics}

# ===============================
# NOTIFICATION DELIVERY
# Second stage: sends what the fan-out queued. Falls back to a logging adapter
# when no mail credentials are configured, so nothing leaves the system until
# MAIL_USERNAME exists.
# ===============================
app.notifications.delivery.poll-interval-ms=5000
app.notifications.delivery.batch-size=20
app.notifications.delivery.max-retry=5
app.notifications.delivery.base-backoff-ms=5000

# ===============================
# SESSIONS AND ONLINE PRESENCE
# Presence is derived from user_sessions.last_seen_at, never a stored boolean.
# The client heartbeat interval and the server's online threshold must be tuned
# together: the threshold has to comfortably exceed the interval, or a live user
# flickers offline between beats.
# ===============================
app.session.heartbeat-seconds=45
app.session.online-threshold-seconds=120
app.outbox.stuck-timeout-seconds=300
