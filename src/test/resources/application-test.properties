# Integration-test profile. The datasource is supplied by Testcontainers.

# validate, never update: the schema comes from the checked-in baseline plus the
# real migration scripts, so any drift between an entity and its hand-written SQL
# FAILS THE BUILD here instead of being silently patched at runtime the way
# ddl-auto=update would do in dev.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# The background workers are driven explicitly in tests; leaving them on their
# timers would make assertions race against the scheduler.
# The recalculation workers would claim the very jobs a test just enqueued and
# race it for them — see DbQueueWorkerManager. Tests call processJob directly.
app.recalc.enabled=false

app.outbox.poll-interval-ms=3600000
app.notifications.delivery.poll-interval-ms=3600000

app.bootstrap.admin.password=Test1234!
app.bootstrap.developer.password=Test1234!
app.security.jwt.secret=test-secret-key-that-is-long-enough-for-hmac-sha256
google.oauth.client-id=
google.oauth.client-secret=

# The dashboard snapshot is computed by the test that needs it; a catch-up sweep
# at context startup would race the data each test sets up.
app.dashboard.insights.compute-on-startup=false

# NO OUTBOUND MAIL FROM THE TEST SUITE.
#
# application.properties imports the developer's .env, so on a machine with real
# Brevo credentials the integration tests inherit them. Any test that COMMITS a
# transaction then fires the after-commit mail listeners for real — the address
# change suite posted codes to invented addresses like nova9@marel.rs through the
# production relay, spending quota on every run.
#
# Blank here overrides the .env value (a profile-specific file outranks an
# imported one), and BrevoEmailSender only registers for a non-empty username, so
# the logging adapter takes over and the mails stay in the log where tests can
# read them.
spring.mail.username=
spring.mail.password=
